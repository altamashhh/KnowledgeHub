# =====================================================================
# KnowledgeHub — Test Profile Configuration
# Active when @ActiveProfiles("test") is set on a test class.
# Uses H2 in-memory database in MySQL compatibility mode.
# =====================================================================

# ─────────────────────────────────────────────
# DataSource — H2 in-memory, MySQL compatibility mode
# NON_KEYWORDS=VALUE prevents H2 from treating VALUE as a reserved word
# ─────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:knowledgehub_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ─────────────────────────────────────────────
# JPA — Hibernate must NOT validate in tests.
# H2 maps TEXT/LONGTEXT to CLOB internally; Hibernate's strict validation
# would fail comparing String fields against CLOB columns.
# Flyway is still the source of truth for schema creation.
# We verify correctness by actually persisting and reading entities.
# ─────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ─────────────────────────────────────────────
# Flyway — runs the same migrations against H2
# This ensures migration SQL is syntactically correct
# and creates the schema for entity persistence tests.
# ─────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT placeholder for tests
jwt.secret=test-secret-key-minimum-256-bits-for-hs256-algorithm-padding
jwt.expiration-ms=86400000
