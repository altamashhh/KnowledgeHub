# =====================================================================
# KnowledgeHub — Example Configuration (commit this file)
# =====================================================================
# Copy this file to application-local.properties (gitignored) and
# fill in your actual values. Never commit real credentials.
# =====================================================================

# DataSource
DB_URL=jdbc:mysql://localhost:3306/knowledgehub?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
DB_USERNAME=your_mysql_username
DB_PASSWORD=your_mysql_password

# JWT (generate a strong random 256-bit key)
JWT_SECRET=your-256-bit-secret-key-here
JWT_EXPIRATION_MS=86400000
