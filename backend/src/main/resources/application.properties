# =====================================================================
# KnowledgeHub — Production Configuration
# =====================================================================
# IMPORTANT: Do NOT commit real credentials.
# Set all sensitive values via environment variables or a local override
# file (application-local.properties, gitignored).
# =====================================================================

spring.application.name=knowledgehub
server.port=8080

# ─────────────────────────────────────────────
# DataSource — MySQL
# ─────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/knowledgehub?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Altamash123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─────────────────────────────────────────────
# JPA / Hibernate
# Flyway is the ONLY owner of schema DDL.
# Hibernate validates the schema but never modifies it.
# ─────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ─────────────────────────────────────────────
# Flyway
# ─────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ─────────────────────────────────────────────
# JWT — Phase 2 (Authentication)
# Values must be overridden in environment before running.
# The placeholder value here will NOT work for real token signing.
# ─────────────────────────────────────────────
jwt.secret=${JWT_SECRET:REPLACE-ME-WITH-256-BIT-SECRET-BEFORE-USE}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
